<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Homelab">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<title>Homelab</title>
<style>
  :root {
    --bg: #0a0e14; --card: #131820; --border: #212830;
    --text: #c9d1d9; --dim: #6e7681; --accent: #58a6ff;
    --green: #3fb950; --orange: #d2991d; --red: #f85149;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #login {
    position: fixed; inset: 0; z-index: 9999; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  #login.done { display: none; }
  .login-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 44px 40px; width: 380px; max-width: 90vw;
    display: flex; flex-direction: column; gap: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
  }
  .login-card .logo { font-size: 36px; text-align: center; }
  .login-card h1 { font-size: 20px; font-weight: 600; text-align: center; margin: 0; }
  .login-card input {
    width: 100%; padding: 12px 16px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 15px; outline: none;
    transition: border-color .2s;
  }
  .login-card input:focus { border-color: var(--accent); }
  .login-card button {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: .2s; letter-spacing: .3px;
  }
  .login-card button:hover { opacity: .85; }
  .login-card button:active { transform: scale(.98); }
  .login-err { color: var(--red); font-size: 13px; text-align: center; display: none; }

  .dash { display: none; width: 100%; min-height: 100vh; min-height: 100dvh; }
  .dash.show { display: flex; }
  .side {
    width: 260px; background: var(--card); border-right: 1px solid var(--border);
    padding: 28px 22px; display: flex; flex-direction: column; gap: 18px; flex-shrink: 0;
  }
  .side h2 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .side h2 .live { width: 7px; height: 7px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .m { display: flex; flex-direction: column; gap: 3px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .m:last-child { border: none; }
  .m-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .8px; }
  .m-row { display: flex; justify-content: space-between; align-items: baseline; }
  .m-val { font-size: 13px; font-weight: 600; }
  .m-bar { height: 3px; border-radius: 2px; background: var(--border); margin-top: 2px; }
  .m-fill { height: 100%; border-radius: 2px; transition: width .4s; }
  .m-fill.g { background: var(--green); } .m-fill.b { background: var(--accent); }
  .m-fill.o { background: var(--orange); }
  .logout {
    margin-top: auto; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--dim); font-size: 12px; cursor: pointer; text-align: center; transition: .2s;
  }
  .logout:hover { border-color: var(--red); color: var(--red); }

  .main { flex:1; padding: 28px 36px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
  .main h1 { font-size: 21px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 16px; text-decoration: none; color: var(--text);
    transition: border-color .2s, transform .15s; display: flex; flex-direction: column; gap: 8px;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card:active { transform: scale(.98); }
  .card .ico { font-size: 26px; }
  .card .ttl { font-size: 13px; font-weight: 600; }
  .card .desc { font-size: 11px; color: var(--dim); line-height: 1.4; }
  .card .url { font-size: 10px; color: var(--accent); word-break: break-all; opacity: .8; }

  .foot { font-size: 11px; color: var(--dim); text-align: center; margin-top: auto; padding: 8px 0; }
  .foot a { color: var(--accent); text-decoration: none; cursor: pointer; }

  @media (max-width: 700px) {
    .dash.show { flex-direction: column; }
    .side { width: 100%; border-right: none; border-bottom: 1px solid var(--border); flex-direction: row; flex-wrap: wrap; gap: 12px; padding: 16px; }
    .side .m { flex: 1 1 40%; border: none; }
    .side h2 { width: 100%; }
    .logout { width: 100%; margin-top: 0; }
    .main { padding: 16px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
</style>
</head>
<body>

<div id="login">
  <form class="login-card" onsubmit="return doLogin()">
    <div class="logo">🏠</div>
    <h1>Homelab</h1>
    <input type="text" id="u" placeholder="Username" autocomplete="username" required autofocus>
    <input type="password" id="p" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Sign In</button>
    <div class="login-err" id="err">Invalid credentials</div>
  </form>
</div>

<div class="dash" id="dash">
  <aside class="side">
    <h2><span class="live"></span>Metrics</h2>
    <div class="m"><span class="m-label">CPU</span><div class="m-row"><span class="m-val" id="mcpu">--</span></div><div class="m-bar"><div class="m-fill g" id="bcpu" style="width:0%"></div></div></div>
    <div class="m"><span class="m-label">RAM</span><div class="m-row"><span class="m-val" id="mram">--</span></div><div class="m-bar"><div class="m-fill b" id="bram" style="width:0%"></div></div></div>
    <div class="m"><span class="m-label">Disk</span><div class="m-row"><span class="m-val" id="mdisk">--</span></div><div class="m-bar"><div class="m-fill o" id="bdisk" style="width:0%"></div></div></div>
    <div class="m"><span class="m-label">Uptime</span><div class="m-row"><span class="m-val" id="mup">--</span></div></div>
    <div class="m"><span class="m-label">Containers</span><div class="m-row"><span class="m-val" id="mcon">--</span></div></div>
    <div class="m"><span class="m-label">Budget</span><div class="m-row"><span class="m-val" id="mbud">--</span></div></div>
    <button class="logout" onclick="logout()">Lock</button>
  </aside>
  <main class="main">
    <h1>Services</h1>
    <div class="grid" id="grid"></div>
    <div class="foot">OCI eu-frankfurt-1 · <a onclick="loadMetrics()">Refresh</a></div>
  </main>
</div>

<script>
var USER = 'Admin', PASS = 'Zion9988!';
var KEY = 'hl_auth';

function auth() {
  try { localStorage.setItem(KEY, '1'); } catch(e) {}
  document.cookie = KEY + '=1; max-age=' + (365*86400) + '; path=/; SameSite=Lax';
  document.getElementById('login').classList.add('done');
  document.getElementById('dash').classList.add('show');
  document.getElementById('err').style.display = 'none';
}

function check() {
  try { if (localStorage.getItem(KEY) === '1') return true; } catch(e) {}
  return document.cookie.split('; ').some(function(c) { return c.startsWith(KEY + '=1'); });
}

function doLogin() {
  var u = document.getElementById('u').value.trim();
  var p = document.getElementById('p').value;
  if (u === USER && p === PASS) { auth(); return false; }
  document.getElementById('err').style.display = 'block';
  document.getElementById('p').value = '';
  return false;
}

function logout() {
  try { localStorage.removeItem(KEY); } catch(e) {}
  document.cookie = KEY + '=; max-age=0; path=/;';
  document.getElementById('login').classList.remove('done');
  document.getElementById('dash').classList.remove('show');
  document.getElementById('u').value = '';
  document.getElementById('p').value = '';
}

var services = [
  { ico:'🎬', ttl:'Jellyfin',    desc:'Media server',             url:'https://jellyfin.lab.logicaflow.dev' },
  { ico:'🎥', ttl:'Radarr',      desc:'Movie manager',            url:'https://radarr.lab.logicaflow.dev' },
  { ico:'📺', ttl:'Sonarr',      desc:'TV series manager',        url:'https://sonarr.lab.logicaflow.dev' },
  { ico:'🔍', ttl:'Prowlarr',    desc:'Indexer aggregator',       url:'https://prowlarr.lab.logicaflow.dev' },
  { ico:'⬇️', ttl:'JDownloader', desc:'Download manager',         url:'https://jdownloader.lab.logicaflow.dev' },
  { ico:'☁️', ttl:'Rclone',      desc:'Cloud mount GUI',          url:'https://rclone.lab.logicaflow.dev' },
  { ico:'📊', ttl:'Cockpit',     desc:'Server monitor',           url:'https://cockpit.lab.logicaflow.dev' },
  { ico:'🔔', ttl:'Alarms',      desc:'OCI alert formatter',      url:'https://alarms.lab.logicaflow.dev' },
];

function build() {
  var g = document.getElementById('grid');
  services.forEach(function(s) {
    var a = document.createElement('a');
    a.className = 'card'; a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = '<span class="ico">' + s.ico + '</span><span class="ttl">' + s.ttl + '</span><span class="desc">' + s.desc + '</span><span class="url">' + s.url.replace('https://','') + '</span>';
    g.appendChild(a);
  });
}

function loadMetrics() {
  fetch('/metrics.json')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      document.getElementById('mcpu').textContent = d.cpu;
      document.getElementById('bcpu').style.width = d.cpu_pct + '%';
      document.getElementById('mram').textContent = d.ram;
      document.getElementById('bram').style.width = d.ram_pct + '%';
      document.getElementById('mdisk').textContent = d.disk;
      document.getElementById('bdisk').style.width = d.disk_pct + '%';
      document.getElementById('mup').textContent = d.uptime;
      document.getElementById('mcon').textContent = d.containers;
      document.getElementById('mbud').textContent = d.budget;
    })
    .catch(function() {
      document.getElementById('mcpu').textContent = '--';
      document.getElementById('mram').textContent = '--';
    });
}

// INIT
if (check()) { auth(); }
build();
loadMetrics();
setInterval(loadMetrics, 60000);

// PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
